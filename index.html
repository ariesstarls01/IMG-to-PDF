<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ảnh → PDF</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;text-align:center;padding:45px 20px}
h1{font-size:32px}p{color:#777}
label,button{display:block;width:100%;max-width:450px;margin:12px auto;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:600}
label{background:#111;color:white}
button{background:#007aff;color:white}
button:disabled{opacity:.4}
input{display:none}
#list{max-width:450px;margin:20px auto;text-align:left;background:white;border-radius:16px;padding:10px}
.item{display:flex;align-items:center;gap:10px;padding:7px;border-bottom:1px solid #eee}
.item img{width:50px;height:50px;object-fit:cover;border-radius:8px}
.num{width:25px;color:#888;text-align:center}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

<body>

<div style="font-size:50px">📄</div>
<h1>Ảnh → PDF</h1>
<p>Chọn ảnh → tự xếp theo tên → tạo PDF</p>

<label for="photos">＋ Chọn ảnh</label>
<input id="photos" type="file" accept="image/*" multiple>

<div id="list"></div>

<button id="make" disabled>Tạo PDF</button>
<p id="status"></p>

<script>
const input=document.getElementById("photos");
const list=document.getElementById("list");
const make=document.getElementById("make");
const status=document.getElementById("status");
let files=[];

function natural(a,b){
 const A=a.toLowerCase().match(/(\d+|\D+)/g)||[];
 const B=b.toLowerCase().match(/(\d+|\D+)/g)||[];
 for(let i=0;i<Math.max(A.length,B.length);i++){
  if(A[i]===undefined)return -1;
  if(B[i]===undefined)return 1;
  if(A[i]===B[i])continue;
  if(/^\d+$/.test(A[i])&&/^\d+$/.test(B[i]))
   return Number(A[i])-Number(B[i]);
  return A[i].localeCompare(B[i],"vi");
 }
 return 0;
}

input.onchange=()=>{
 files=[...input.files].sort((a,b)=>natural(a.name,b.name));
 list.innerHTML="";
 files.forEach((f,i)=>{
  let row=document.createElement("div");
  row.className="item";
  let n=document.createElement("div");
  n.className="num";
  n.textContent=i+1;
  let img=document.createElement("img");
  img.src=URL.createObjectURL(f);
  let name=document.createElement("div");
  name.className="name";
  name.textContent=f.name;
  row.append(n,img,name);
  list.append(row);
 });
 make.disabled=!files.length;
 status.textContent=files.length?"Đã chọn "+files.length+" ảnh.":"";
};

function loadImage(file){
 return new Promise((resolve,reject)=>{
  let url=URL.createObjectURL(file);
  let img=new Image();
  img.onload=()=>{
   URL.revokeObjectURL(url);
   resolve(img);
  };
  img.onerror=reject;
  img.src=url;
 });
}

function jpeg(img){
 let max=1800;
 let scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 let w=Math.round(img.naturalWidth*scale);
 let h=Math.round(img.naturalHeight*scale);
 let c=document.createElement("canvas");
 c.width=w;c.height=h;
 c.getContext("2d").drawImage(img,0,0,w,h);
 let b64=c.toDataURL("image/jpeg",.85).split(",")[1];
 let bin=atob(b64);
 let bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return {bytes,w,h};
}

function makePDF(images){
 const W=595.28,H=841.89,M=22;
 let objects=[];
 objects[1]="<< /Type /Catalog /Pages 2 0 R >>";
 let pages=[],imgs=[],contents=[];
 let num=3;

 for(let i=0;i<images.length;i++){
  pages.push(num++);
  imgs.push(num++);
  contents.push(num++);
 }

 objects[2]=`<< /Type /Pages /Kids [${pages.map(x=>x+" 0 R").join(" ")}] /Count ${images.length} >>`;

 for(let i=0;i<images.length;i++){
  let im=images[i];
  let w=W-M*2;
  let h=w*im.h/im.w;
  if(h>H-M*2){
   h=H-M*2;
   w=h*im.w/im.h;
  }
  let x=(W-w)/2;
  let y=(H-h)/2;

  objects[pages[i]]=
  `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] `+
  `/Resources << /XObject << /Im${i} ${imgs[i]} 0 R >> >> `+
  `/Contents ${contents[i]} 0 R >>`;

  let stream=`q
${w} 0 0 ${h} ${x} ${y} cm
/Im${i} Do
Q`;

  objects[contents[i]]=
  `<< /Length ${stream.length} >>
stream
${stream}
endstream`;

  objects[imgs[i]]=
  {data:im.bytes,w:im.w,h:im.h};
 }

 let pdf="%PDF-1.4\n%\xFF\xFF\xFF\xFF\n";
 let offsets=[0];

 for(let i=1;i<objects.length;i++){
  offsets[i]=pdf.length;
  pdf+=i+" 0 obj\n";

  let o=objects[i];

  if(typeof o==="string"){
   pdf+=o+"\nendobj\n";
  }else{
   pdf+=`<< /Type /XObject /Subtype /Image /Width ${o.w} /Height ${o.h} `+
   `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode `+
   `/Length ${o.data.length} >>\nstream\n`;

   for(let j=0;j<o.data.length;j++)
    pdf+=String.fromCharCode(o.data[j]);

   pdf+="\nendstream\nendobj\n";
  }
 }

 let xref=pdf.length;
 pdf+=`xref
0 ${objects.length}
0000000000 65535 f 
`;

 for(let i=1;i<objects.length;i++)
  pdf+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";

 pdf+=`trailer
<< /Size ${objects.length} /Root 1 0 R >>
startxref
${xref}
%%EOF`;

 let out=new Uint8Array(pdf.length);
 for(let i=0;i<pdf.length;i++)
  out[i]=pdf.charCodeAt(i)&255;

 return new Blob([out],{type:"application/pdf"});
}

make.onclick=async()=>{
 try{
  make.disabled=true;
  status.textContent="Đang tạo PDF…";

  let images=[];
  for(let f of files){
   let img=await loadImage(f);
   images.push(jpeg(img));
  }

  let blob=makePDF(images);
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="anh-to-pdf.pdf";
  a.click();

  status.textContent="✅ Đã tạo PDF";
  make.disabled=false;
 }catch(e){
  console.error(e);
  status.textContent="Có lỗi khi tạo PDF";
  make.disabled=false;
 }
};
</script>

</body>
</html>
